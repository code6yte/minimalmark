name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-fedora:
    name: Fedora 44
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            rust cargo \
            gtk4-devel glib2-devel \
            webkit2gtk4.1-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fedora-44-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fedora-44-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: fedora-44-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            fedora-44-target-

      - name: Build
        run: cargo build --release

      - name: Run checks
        run: cargo check --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minimalmark-fedora-44
          path: target/release/minimalmark
          if-no-files-found: error
