name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-fedora:
    name: Fedora ${{ matrix.fedora-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora-version: ["40", "41"]
    container: fedora:${{ matrix.fedora-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          dnf install -y \
            rust cargo \
            gtk4-devel glib2-devel \
            webkit2gtk4.1-devel \
            libadwaita-devel \
            gtksourceview5-devel \
            pkg-config

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-fedora-${{ matrix.fedora-version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora-${{ matrix.fedora-version }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-fedora-${{ matrix.fedora-version }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fedora-${{ matrix.fedora-version }}-target-

      - name: Build
        run: cargo build --release

      - name: Run checks
        run: cargo check --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minimalmark-fedora-${{ matrix.fedora-version }}
          path: target/release/minimalmark
          if-no-files-found: error
