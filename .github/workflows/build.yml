name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-fedora:
    name: Fedora ${{ matrix.fedora-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora-version: ["40", "41"]
    container: fedora:${{ matrix.fedora-version }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          dnf install -y \
            curl gcc pkg-config \
            gtk4-devel glib2-devel \
            webkit2gtk4.1-devel \
            libadwaita-devel \
            gtksourceview5-devel

      - name: Install Rust via rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: fedora-${{ matrix.fedora-version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fedora-${{ matrix.fedora-version }}-cargo-

      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: fedora-${{ matrix.fedora-version }}-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: fedora-${{ matrix.fedora-version }}-target-

      - name: Build
        run: |
          source "$HOME/.cargo/env"
          cargo build --release

      - name: Run checks
        run: |
          source "$HOME/.cargo/env"
          cargo check --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: minimalmark-fedora-${{ matrix.fedora-version }}
          path: target/release/minimalmark
          if-no-files-found: error
