[package]
name = "minimalmark"
version = "0.1.0"
edition = "2021"
description = "A minimal, fast Markdown editor for GNOME"
authors = ["MinimalMark Contributors"]

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
glib = "0.20"
gio = "0.20"
adw = { package = "libadwaita", version = "0.7", features = ["v1_4"] }
sourceview5 = { package = "gtksourceview5", version = "0.9" }
webkit2gtk = { version = "2.0", features = ["v2_42"] }
pulldown-cmark = { version = "0.12", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
